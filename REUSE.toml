# SPDX-FileCopyrightText: 2026 Nicholas Outram
# SPDX-License-Identifier: GPL-3.0-only

# Licensing of files that can't carry an SPDX header. Checked with `reuse lint`.
version = 1
SPDX-PackageName = "Pygoscribe"
SPDX-PackageSupplier = "Nicholas Outram"
SPDX-PackageDownloadLocation = "https://github.com/noutram/pygoscribe"

[[annotations]]
path = [
    ".gitignore",
    "Cargo.lock",
    "**/*.md",
    "docs/**",
    "data/icons/**",
    "data/*.desktop",
    "build-aux/**",
    "debian/**",
    "about.hbs",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Nicholas Outram"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = "data/org.outram.Pygoscribe.metainfo.xml"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Nicholas Outram"
SPDX-License-Identifier = "CC0-1.0"

# Copied from GTK; stays under GTK's license.
[[annotations]]
path = "data/protocol/gtk-shell.xml"
precedence = "aggregate"
SPDX-FileCopyrightText = "The GTK Project Authors"
SPDX-License-Identifier = "LGPL-2.1-or-later"

# Generated by `cargo about` from the licenses of the Rust crates it lists.
[[annotations]]
path = "THIRD-PARTY-LICENSES.md"
precedence = "override"
SPDX-FileCopyrightText = "2026 Nicholas Outram"
SPDX-License-Identifier = "GPL-3.0-only"
