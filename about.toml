# `cargo about generate about.hbs -o THIRD-PARTY-LICENSES.md` (install.sh runs
# it) lists every crate in the build with its license text.
# Where a crate offers a choice, the first accepted license here is used.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unlicense",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "LGPL-2.1-or-later",
]
targets = ["x86_64-unknown-linux-gnu"]
# Pygoscribe itself (publish = false) is covered by LICENSE.
private = { ignore = true }
ignore-dev-dependencies = true
