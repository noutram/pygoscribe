# `cargo deny check licenses` (install.sh runs it before every build) fails
# when a crate's license isn't on this list: Pygoscribe is GPL-3.0-only, so
# everything compiled in must be GPL-3 compatible. Notably absent:
# GPL-2.0-only, AGPL, SSPL and anything unlicensed or unknown.
[graph]
targets = ["x86_64-unknown-linux-gnu"]

[licenses]
allow = [
    "GPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unlicense",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "LGPL-2.1-or-later",
]
confidence-threshold = 0.9
# The list is a policy, not an inventory: no warning for unused entries.
unused-allowed-license = "allow"

[licenses.private]
ignore = false
